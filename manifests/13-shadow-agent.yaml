# shadow-assistant: the same agent image and the same human login, but a DIFFERENT workload identity
# (spiffe://<CLUSTER_NAME>/ns/castellan-agents/sa/shadow-assistant). Users never authorized it (may_act),
# and no tool policy names it. It exists to show that the human's consent and the workload's identity
# are both required, in the UI, side by side with the real agent.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shadow-assistant
  namespace: castellan-agents
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shadow-assistant
  namespace: castellan-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shadow-assistant
  template:
    metadata:
      labels:
        app: shadow-assistant
    spec:
      serviceAccountName: shadow-assistant
      containers:
      - name: agent
        image: ${AGENT_IMAGE}
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: AGENT_NAME
          value: shadow-assistant
        - name: TRUST_DOMAIN       # Istio meshConfig.trustDomain; shown in the SPIFFE ID on the identity card
          value: ${CLUSTER_NAME}
        - name: POD_NAMESPACE
          valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
        - name: SERVICE_ACCOUNT
          valueFrom: { fieldRef: { fieldPath: spec.serviceAccountName } }
        - name: USER_TOKEN_HEADER
          value: "x-user-access-token"
        - name: STS_WELL_KNOWN_URL
          value: "http://enterprise-agentgateway.agentgateway-system.svc.cluster.local:7777/.well-known/openid-configuration"
        - name: ACTOR_TOKEN_PATH
          value: /var/run/secrets/tokens/sts-actor
        - name: LLM_BASE_URL
          value: "http://llm.castellan.internal/openai/v1"
        - name: LLM_MODEL
          value: gpt-4o-mini
        - name: MCP_URL
          value: "http://castellan-ops.castellan-tools.svc.cluster.local/mcp"
        - name: LOGOUT_URL
          value: "http://localhost:8180/realms/castellan/protocol/openid-connect/logout?client_id=castellan-assistant&post_logout_redirect_uri=http%3A%2F%2Flocalhost%3A8080%2Flogout"
        volumeMounts:
        - name: sts-actor
          mountPath: /var/run/secrets/tokens
          readOnly: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        resources:
          requests:
            cpu: 50m
            memory: 192Mi
      volumes:
      - name: sts-actor
        projected:
          sources:
          - serviceAccountToken:
              path: sts-actor
              expirationSeconds: 3600
---
apiVersion: v1
kind: Service
metadata:
  name: shadow-assistant
  namespace: castellan-agents
  labels:
    app: shadow-assistant
spec:
  selector:
    app: shadow-assistant
  ports:
  - name: http
    port: 80
    targetPort: 8080
    appProtocol: http
