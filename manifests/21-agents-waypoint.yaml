# A second agentgateway waypoint, for the agents' namespace. Agent-to-agent calls (assistant -> clearance)
# and ingress -> agent calls pass through it, so they get policy and a span like every other hop.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-waypoint
  namespace: castellan-agents
  labels:
    istio.io/waypoint-for: all
spec:
  gatewayClassName: enterprise-agentgateway-waypoint
  listeners:
  - name: mesh
    port: 15008
    protocol: HBONE
