# Builds the two demo images for amd64 and arm64 and publishes them to GHCR
# (ghcr.io/<owner>/<repo>/castellan-assistant and .../castellan-ops-mcp).
# Bump the tags here and in scripts/00-env.sh together.
name: images
on:
  push:
    branches: [main]
    paths: [agent/**, mcp-server/**, .github/workflows/images.yaml]
  workflow_dispatch:
env:
  AGENT_TAG: v0.3.5
  MCP_TAG: v0.1.0
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
        - { name: castellan-assistant, context: agent, tag_var: AGENT_TAG }
        - { name: castellan-ops-mcp, context: mcp-server, tag_var: MCP_TAG }
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: image name
      id: img
      run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
    - uses: docker/build-push-action@v6
      with:
        context: ${{ matrix.context }}
        platforms: linux/amd64,linux/arm64
        push: true
        labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
        tags: |
          ${{ steps.img.outputs.ref }}:${{ env[matrix.tag_var] }}
          ${{ steps.img.outputs.ref }}:latest
